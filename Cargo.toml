[package]

name = "mime"
version = "0.4.0-a.0" # remember to update html_root_url
authors = ["Sean McArthur <sean@seanmonstar.com>"]
license = "MIT"
description = "Strongly Typed Mimes"
documentation = "https://docs.rs/mime"
repository = "https://github.com/hyperium/mime"
keywords = ["mime", "media-extensions", "media-types"]
edition = "2018"

publish = false # breaking changes from 0.3.x

[dependencies]
mime-macro = { path = "./mime-macro", optional = true }
mime-parse = { path = "./mime-parse" }
proc-macro-hack = { version = "0.5", optional = true }
quoted-string = "0.2.2"
serde1 = { version = "1", optional = true, package = "serde" }
# ETNA benchmark runner framework dependencies (used by src/bin/etna.rs and
# src/etna.rs — the workload's property-based test harness).
proptest = "1.0"
quickcheck = { path = "/Users/akeles/Programming/projects/PbtBenchmark/quickcheck", features = ["etna"] }
crabcheck = { path = "/Users/akeles/Programming/projects/PbtBenchmark/crabcheck" }
hegeltest = "0.3.7"

[features]
macro = ["mime-macro", "proc-macro-hack"]
# "serde1" optional support

[[bin]]
name = "etna"
path = "src/bin/etna.rs"

[workspace]
members = [
    "./",
    "mime-macro",
    "mime-parse",
]
